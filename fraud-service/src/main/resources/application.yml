spring:
  application:
    name: fraud-service
  datasource:
    url: ${FRAUD_DB_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${FRAUD_DB_USER:ledger}
    password: ${FRAUD_DB_PASSWORD:ledger}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: fraud-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

fraud:
  mode: ${FRAUD_MODE:SHADOW}                       # SHADOW or ACTIVE
  transactions-topic: ${FRAUD_TRANSACTIONS_TOPIC:ledger.transactions.v1}
  feature-retention-seconds: ${FRAUD_FEATURE_RETENTION_SECONDS:7200}
  rules:
    hard-amount-cap-minor: ${FRAUD_HARD_CAP_MINOR:1000000}       # 10,000.00
    velocity-review: ${FRAUD_VELOCITY_REVIEW:5}
    velocity-block: ${FRAUD_VELOCITY_BLOCK:10}
    new-counterparty-amount-minor: ${FRAUD_NEW_CP_MINOR:50000}   # 500.00
    hourly-spend-cap-minor: ${FRAUD_SPEND_CAP_MINOR:2000000}     # 20,000.00

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: fraud-service
