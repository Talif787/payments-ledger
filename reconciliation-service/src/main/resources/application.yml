spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${RECON_DB_URL:jdbc:postgresql://localhost:5432/reconciliation}
    username: ${RECON_DB_USER:ledger}
    password: ${RECON_DB_PASSWORD:ledger}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

recon:
  # Read-only connection to the ledger database (a read replica in production).
  ledger-datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
  transactions-topic: ${RECON_TRANSACTIONS_TOPIC:ledger.transactions.v1}
  schedule-ms: ${RECON_SCHEDULE_MS:15000}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: reconciliation-service

security:
  enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-change-32bytes-minimum-0123456789}
