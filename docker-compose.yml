services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the reconciliation database on first initialization.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  ledger-service:
    build:
      context: ./ledger-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      DB_USER: ledger
      DB_PASSWORD: ledger
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP: kafka:9092
      RELAY_ENABLED: "true"
    ports:
      - "8080:8080"

  reconciliation-service:
    build:
      context: ./reconciliation-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-service:
        condition: service_started
    environment:
      RECON_DB_URL: jdbc:postgresql://postgres:5432/reconciliation
      RECON_DB_USER: ledger
      RECON_DB_PASSWORD: ledger
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
      KAFKA_BOOTSTRAP: kafka:9092
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

volumes:
  pgdata:
