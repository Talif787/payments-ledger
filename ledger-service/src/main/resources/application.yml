spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
      pool-name: ledger-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.ledger: INFO

ledger:
  relay:
    enabled: ${RELAY_ENABLED:true}
    batch-size: ${RELAY_BATCH_SIZE:100}
    interval-ms: ${RELAY_INTERVAL_MS:1000}
    accounts-topic: ledger.accounts.v1
    transactions-topic: ledger.transactions.v1

  fraud:
    enabled: ${FRAUD_ENABLED:false}
    url: ${FRAUD_URL:http://localhost:8082}
    timeout-ms: ${FRAUD_TIMEOUT_MS:150}

security:
  enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-change-32bytes-minimum-0123456789}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-per-second: ${RATE_LIMIT_REFILL:10}
  service-token:
    scope: fraud:evaluate
